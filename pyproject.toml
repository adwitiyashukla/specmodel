[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specmodel"
version = "0.1.0"
description = "Turns a client spec into a trained, evaluated and hosted custom language model, every part written from scratch in PyTorch"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
    "pyarrow>=15",
    "safetensors>=0.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff==0.16.8"]

[project.scripts]
specmodel = "specmodel.cli:main"

[tool.setuptools.packages.find]
include = ["specmodel*"]

[tool.setuptools.package-data]
specmodel = ["index.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"specmodel/serve.py" = ["BLE001"]
"tests/synthetic.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
